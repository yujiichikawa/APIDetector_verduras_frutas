<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HortVision</title>
    <link rel="stylesheet" href="../static/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>HortVision</h1>

    <video id="webcam" width="640" height="480" autoplay></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <button onclick="captureAndSendImage()">Capturar e Enviar Imagem</button>

    <h2>Produtos no Carrinho:</h2>
    <div id="cart"></div>

    <script>
        function startWebcam() {
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    const webcamElement = document.getElementById('webcam');
                    webcamElement.srcObject = stream;
                })
                .catch(function(error) {
                    alert('Erro ao acessar a webcam: ' + error.message);
                });
        }

        function captureAndSendImage() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(function(blob) {
                const formData = new FormData();
                formData.append('image', blob, 'image.jpg');

                $.ajax({
                    url: '/predict',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        renderCart(response.cart);
                    },
                    error: function(error) {
                        alert('Erro ao processar a imagem.');
                    }
                });
            }, 'image/jpeg');
        }

        function renderCart(cart) {
            const cartDiv = $('#cart');
            cartDiv.empty();

            let total = 0;
            cart.forEach(product => {
                total += product.total_price;
                cartDiv.append(`
                    <div>
                        <p>Nome: ${product.name}</p>
                        <p>Peso: ${product.weight} kg</p>
                        <p>Preço/kg: R$${product.price_per_kg}</p>
                        <p>Quantidade: ${product.quantity}</p>
                        <p>Total: R$${product.total_price.toFixed(2)}</p>
                        <button onclick="removeItem('${product.name}')">Remover</button>
                        <hr>
                    </div>
                `);
            });

            cartDiv.append(`<h3>Total Geral: R$${total.toFixed(2)}</h3>`);
        }

        function removeItem(name) {
            $.ajax({
                url: '/remove',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ name: name }),
                success: function(response) {
                    renderCart(response.cart);
                },
                error: function(error) {
                    alert('Erro ao remover o produto.');
                }
            });
        }

        window.onload = startWebcam;
    </script>
</body>
</html>
