<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HortVision</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<h1>HortVision</h1>

<div>
    <h2>Buscar no Catálogo</h2>
    <input type="text" id="searchName" placeholder="Nome do produto">
    <input type="number" id="minPrice" placeholder="Preço mínimo" step="0.01">
    <input type="number" id="maxPrice" placeholder="Preço máximo" step="0.01">
    <button onclick="searchCatalog()">Buscar</button>
</div>

<h2>Produtos Encontrados:</h2>
<div id="searchResults"></div>

<hr>

<video id="webcam" width="640" height="480" autoplay></video>
<canvas id="canvas" style="display:none;"></canvas>

<button onclick="captureAndSendImage()">Capturar e Enviar Imagem</button>

<div id="loading" style="display:none;">
    <p>Processando alimentos...</p>
</div>

<hr>

<h2>Produtos no Carrinho:</h2>
<div id="cart"></div>
<button onclick="clearCart()">Limpar Carrinho</button>

<hr>

<h2>Histórico de Compras:</h2>
<button onclick="loadHistory()">Carregar Histórico</button>
<div id="history"></div>

<button onclick="checkout()">Finalizar Compra</button>

<script>
function startWebcam() {
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
            document.getElementById('webcam').srcObject = stream;
        })
        .catch(error => {
            alert('Erro ao acessar a webcam: ' + error.message);
        });
}

function captureAndSendImage() {
    $('#loading').show();

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0);

    canvas.toBlob(blob => {
        const formData = new FormData();
        formData.append('image', blob, 'image.jpg');

        $.ajax({
            url: '/predict',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: res => {
                renderCart(res.cart);
                $('#loading').hide();
            },
            error: () => {
                alert('Erro ao processar a imagem');
                $('#loading').hide();
            }
        });
    }, 'image/jpeg');
}

function renderCart(cart) {
    const cartDiv = $('#cart');
    cartDiv.empty();

    let total = 0;

    cart.forEach(product => {
        total += product.total_price;

        cartDiv.append(`
            <div>
                <p><strong>Nome:</strong> ${product.name}</p>
                <p><strong>Preço/kg:</strong> R$ ${product.price_per_kg}</p>
                <p><strong>Quantidade:</strong> ${product.quantity}</p>
                <p><strong>Total:</strong> R$ ${product.total_price.toFixed(2)}</p>
                <button onclick="removeItem('${product.name}')">Remover</button>
                <hr>
            </div>
        `);
    });

    cartDiv.append(`<h3>Total Geral: R$ ${total.toFixed(2)}</h3>`);
}

function searchCatalog() {
    const name = $('#searchName').val();
    const minPrice = $('#minPrice').val();
    const maxPrice = $('#maxPrice').val();

    const params = [];
    if (name) params.push('name=' + encodeURIComponent(name));
    if (minPrice) params.push('min_price=' + encodeURIComponent(minPrice));
    if (maxPrice) params.push('max_price=' + encodeURIComponent(maxPrice));

    const url = '/catalog/search?' + params.join('&');

    $.get(url, res => {
        renderSearchResults(res.results);
    }).fail(() => {
        alert('Erro ao buscar produtos.');
    });
}

function renderSearchResults(results) {
    const div = $('#searchResults');
    div.empty();

    if (results.length === 0) {
        div.append('<p>Nenhum produto encontrado.</p>');
        return;
    }

    results.forEach(p => {
        div.append(`
            <div>
                <p><strong>Nome:</strong> ${p.name}</p>
                <p><strong>Preço/kg:</strong> R$ ${p.price_per_kg}</p>
                <hr>
            </div>
        `);
    });
}

function loadHistory() {
    $.get('/orders', res => {
        renderHistory(res.orders);
    });
}

function renderHistory(history) {
    const div = $('#history');
    div.empty();

    if (history.length === 0) {
        div.append('<p>Nenhum histórico encontrado.</p>');
        return;
    }

    history.forEach(order => {
        div.append(`
            <div>
                <p><strong>Data:</strong> ${order.date}</p>
                <p><strong>Total:</strong> R$ ${order.total.toFixed(2)}</p>
                <ul>
                    ${order.items.map(i => `<li>${i.name} - R$ ${i.total_price.toFixed(2)}</li>`).join('')}
                </ul>
                <hr>
            </div>
        `);
    });
}

function checkout() {
    $.post('/checkout', res => {
        alert(res.message);
        loadHistory();
    }).fail(err => {
        alert(err.responseJSON?.error || 'Erro no checkout');
    });
}

function clearCart() {
    $.post('/clear', res => renderCart(res.cart));
}

function removeItem(name) {
    $.ajax({
        url: '/remove',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ name }),
        success: res => renderCart(res.cart)
    });
}

window.onload = startWebcam;
</script>

</body>
</html>
