services:

  hortvision_db:
    image: mysql:8.0
    container_name: hortvision_db
    environment:
      MYSQL_DATABASE: hortvision
      MYSQL_USER: hortuser
      MYSQL_PASSWORD: hortpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hortvision_net

  api:
    build: .
    container_name: hortvision_api
    ports:
      - "5000:5000"
    environment:
      DB_HOST: hortvision_db
      DB_USER: hortuser
      DB_PASSWORD: hortpass
      DB_NAME: hortvision
    depends_on:
      hortvision_db:
        condition: service_healthy
    restart: always
    networks:
      - hortvision_net


  mysql-server:
      image: mysql:${MYSQL_VERSION}  
      container_name: mysql-server
      environment:
        MYSQL_DATABASE: "${MYSQL_DATABASE}"        
        MYSQL_USER: "${MYSQL_USER}"                
        MYSQL_PASSWORD: "${MYSQL_PASSWORD}"        
        MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"  
      command: --character-set-server=utf8 --collation-server=utf8_bin  
      healthcheck:
        test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpass || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 40s
      volumes:
        - mysql-data:/var/lib/mysql  
      restart: unless-stopped
      networks:
        - hortvision_net

  zabbix-server:
    image: zabbix/zabbix-server-mysql:${ZABBIX_VERSION}
    container_name: zabbix-server
    ports:
      - "10051:10051"
    environment:
      DB_SERVER_HOST: "${DB_SERVER_HOST}"         
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      ZBX_STARTPOLLERS: "${ZBX_STARTPOLLERS}"     
      ZBX_STARTPINGERS: "${ZBX_STARTPINGERS}"     
      ZBX_STARTUNREACHABLE: "${ZBX_STARTUNREACHABLE}"
      ZBX_STARTSNMPPOLLERS: "${ZBX_STARTSNMPPOLLERS}"
      ZBX_STARTTRAPPERS: "${ZBX_STARTTRAPPERS}"
      ZBX_STARTDBSYNCERS: "${ZBX_STARTDBSYNCERS}"
      ZBX_TIMEOUT: "${ZBX_TIMEOUT}"
      ZBX_VALUECACHESIZE: "${ZBX_VALUECACHESIZE}"
      ZBX_HISTORYCACHESIZE: "${ZBX_HISTORYCACHESIZE}"
      ZBX_HISTORYINDEXCACHESIZE: "${ZBX_HISTORYINDEXCACHESIZE}"
      ZBX_CACHESIZE: "${ZBX_CACHESIZE}"
      ZBX_TRENDCACHESIZE: "${ZBX_TRENDCACHESIZE}"
      TZ: "${TZ}"
    depends_on:
      - mysql-server  
    restart: unless-stopped
    networks:
      - hortvision_net

  zabbix-web:
    image: zabbix/zabbix-web-apache-mysql:${ZABBIX_VERSION}
    container_name: zabbix-web
    ports:
      - "8080:8080"
    environment:
      ZBX_SERVER_HOST: "${ZBX_SERVER_HOST}"   
      DB_SERVER_HOST: "${DB_SERVER_HOST}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      PHP_TZ: "${PHP_TZ}"                     
      TZ: "${TZ}"
    depends_on:
      - zabbix-server
    restart: unless-stopped
    networks:
      - hortvision_net

  zabbix-agent2:
    image: zabbix/zabbix-agent2:${ZABBIX_VERSION}
    container_name: zabbix-agent2
    environment:
      ZBX_HOSTNAME: "Zabbix server"           
      ZBX_SERVER_HOST: "${ZBX_SERVER_HOST}"   
    depends_on:
      - zabbix-server
    restart: always
    networks:
      - hortvision_net

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app  
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - hortvision_net

volumes:
  mysql_data:
  mysql-data:
  grafana-data:

networks:
  hortvision_net:
    driver: bridge
